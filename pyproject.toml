# SPDX-License-Identifier: Apache-2.0
[project]
name = "jumar"
version = "0.1.0"
description = "Turn a todo list into verified work: decompose, do one subtask at a time, prove each one before the next."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Justin Mclean"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
jumar = "jumar.cli:main"

[project.urls]
Homepage = "https://github.com/justinmclean/jumar"
Repository = "https://github.com/justinmclean/jumar"
Issues = "https://github.com/justinmclean/jumar/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jumar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 90

[tool.jumar]
todo_path = "todo.md"
max_subtasks = 12
max_repairs = 2
subtask_timeout_s = 900
halt_on_fail = false
commit_on_complete = false
capabilities = ["read_fs", "write_fs", "run_commands"]
evidence_head_bytes = 4000
