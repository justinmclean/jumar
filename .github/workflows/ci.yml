# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: make install
      - name: Run checks
        run: make check
      - name: Old-name grep gate (post-rename)
        run: |
          ! grep -rnE '\bgsd\b|getstuffdone|GetStuffDone' \
              src tests tools pyproject.toml Makefile \
            | grep -v 'legacy-name-ok'

